<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Incanto · תפריט</title>
<meta name="theme-color" content="#1a2b28">
<style>
  :root{
    --ink:#1a2b28; --ink-soft:#3c534d;
    --paper:#f6f2e8; --paper-2:#ece6d6; --line:#d8cfb8;
    --brass:#b8863b; --brass-d:#8f6725;
    --sale:#2f6f4e; --sale-d:#245c40; --danger:#a8412e;
    --white:#fdfbf5;
    --shadow:0 2px 0 rgba(26,43,40,.10), 0 8px 24px rgba(26,43,40,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","Assistant","Heebo",system-ui,sans-serif;
    background:var(--paper); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:3px solid var(--brass); outline-offset:2px}

  /* ---- header ---- */
  .hero{
    background:linear-gradient(160deg,#22352f,#101c18); color:#fdfbf5;
    padding:26px 18px 20px; text-align:center;
  }
  .hero .logo{
    width:56px;height:56px;border-radius:16px;margin:0 auto 10px;display:grid;place-items:center;
    background:linear-gradient(160deg,var(--brass),var(--brass-d));font-size:28px;box-shadow:var(--shadow);
  }
  .hero h1{font-size:26px;letter-spacing:1px}
  .hero p{opacity:.75;font-size:14px;margin-top:4px}

  /* ---- category chips ---- */
  .cats{
    position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;padding:12px 16px;
    background:rgba(246,242,232,.94);backdrop-filter:blur(6px);border-bottom:1.5px solid var(--line);
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex:none;border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);
    padding:9px 16px;border-radius:999px;font-weight:800;font-size:14px;
  }
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ---- items ---- */
  main{padding:16px 16px 120px;max-width:760px;margin:0 auto}
  .cat-title{font-size:19px;font-weight:900;margin:18px 2px 10px}
  .dish{
    display:flex;gap:12px;background:var(--white);border:1.5px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);padding:12px;margin-bottom:12px;align-items:center;
  }
  .dish img,.dish .noimg{
    width:86px;height:86px;border-radius:12px;object-fit:cover;flex:none;
    background:linear-gradient(160deg,var(--paper-2),var(--line));display:grid;place-items:center;font-size:30px;
  }
  .dish .info{flex:1;min-width:0}
  .dish .nm{font-weight:900;font-size:16px}
  .dish .ds{color:var(--ink-soft);font-size:13px;line-height:1.45;margin-top:3px}
  .dish .pr{color:var(--sale-d);font-weight:900;font-size:15px;margin-top:6px}
  .dish .act{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px}
  .addbtn{
    width:42px;height:42px;border-radius:50%;border:none;color:#fff;font-size:22px;font-weight:900;
    background:linear-gradient(160deg,var(--brass),var(--brass-d));box-shadow:var(--shadow);
  }
  .qtyrow{display:flex;align-items:center;gap:8px}
  .qtyrow button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);font-size:18px;font-weight:900}
  .qtyrow b{min-width:18px;text-align:center;font-size:16px}

  .state-msg{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:15px;line-height:1.7}

  /* ---- floating cart bar ---- */
  .cartbar{
    position:fixed;bottom:14px;inset-inline:14px;z-index:40;max-width:732px;margin:0 auto;
    background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px;
    display:none;justify-content:space-between;align-items:center;gap:10px;
    box-shadow:0 12px 34px rgba(0,0,0,.35);border:none;width:calc(100% - 28px);
    font-size:17px;font-weight:900;
  }
  .cartbar.show{display:flex}
  .cartbar .cnt{background:var(--brass);border-radius:999px;padding:3px 11px;font-size:14px}

  /* ---- sheets / overlays ---- */
  .sheet-wrap{position:fixed;inset:0;background:rgba(16,28,24,.55);z-index:50;display:none;align-items:flex-end}
  .sheet-wrap.show{display:flex}
  .sheet{
    background:var(--paper);width:100%;max-height:88dvh;border-radius:22px 22px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;max-width:760px;margin:0 auto;
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h2{font-size:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .x{border:none;background:var(--paper-2);width:34px;height:34px;border-radius:50%;font-size:18px}
  .cline{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}
  .cline .nm{flex:1;font-weight:800;font-size:15px}
  .cline .pr{font-weight:900;min-width:64px;text-align:left}
  .total-row{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:14px 2px}
  .field{margin:10px 0}
  .field label{display:block;font-size:13px;font-weight:800;color:var(--ink-soft);margin-bottom:5px}
  .field input{width:100%;font-size:16px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--white)}
  .bigbtn{
    width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;font-weight:900;color:#fff;
    background:linear-gradient(160deg,var(--sale),var(--sale-d));box-shadow:var(--shadow);margin-top:8px;
  }
  .bigbtn.brass{background:linear-gradient(160deg,var(--brass),var(--brass-d))}
  .bigbtn:disabled{opacity:.5}
  .ghostbtn{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:var(--white);font-weight:800;font-size:15px;margin-top:10px}
  .mini{font-size:12.5px;color:var(--ink-soft);line-height:1.6}

  /* ---- payment modal (in-app Grow checkout) ---- */
  .paywrap{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column}
  .paywrap.show{display:flex}
  .paytop{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1.5px solid var(--line);background:var(--white)}
  .paytop b{flex:1;font-size:16px}
  .paywrap iframe{flex:1;border:none;width:100%}
  .paywait{padding:10px 16px;text-align:center;font-size:13px;color:var(--ink-soft);background:var(--paper-2)}
  .spin{display:inline-block;width:14px;height:14px;border:2.5px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-inline-start:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- confirmation ---- */
  .confirm{position:fixed;inset:0;z-index:70;background:var(--paper);display:none;place-items:center;padding:24px;text-align:center}
  .confirm.show{display:grid}
  .confirm .ck{width:84px;height:84px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:42px;color:#fff;background:linear-gradient(160deg,var(--sale),var(--sale-d));box-shadow:var(--shadow)}
  .confirm .num{font-size:52px;font-weight:900;color:var(--brass-d);margin:10px 0}
</style>
</head>
<body>
  <header class="hero">
    <div class="logo">🍽</div>
    <h1 id="bizName">Incanto</h1>
    <p id="bizSub">תפריט · הזמנה עצמית</p>
  </header>

  <nav class="cats" id="cats" aria-label="קטגוריות"></nav>

  <main id="menuMain">
    <div class="state-msg" id="stateMsg">טוען תפריט<span class="spin"></span></div>
  </main>

  <button class="cartbar" id="cartBar" aria-label="פתיחת סל ההזמנה">
    <span><span class="cnt" id="cartCnt">0</span> פריטים</span>
    <span>לסל ההזמנה · <span id="cartBarTotal">₪0</span></span>
  </button>

  <!-- cart + checkout sheet -->
  <div class="sheet-wrap" id="cartSheet">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="סל ההזמנה">
      <h2>ההזמנה שלי <button class="x" id="cartClose" aria-label="סגירה">×</button></h2>
      <div id="cartLines"></div>
      <div class="total-row"><span>סה״כ</span><span id="cartTotal">₪0</span></div>
      <div class="field"><label>שם (יופיע על ההזמנה)</label><input id="custName" autocomplete="name" placeholder="השם שלך"></div>
      <div class="field"><label>טלפון (אופציונלי)</label><input id="custPhone" autocomplete="tel" inputmode="tel" placeholder="050..."></div>
      <button class="bigbtn" id="checkoutBtn">להזמנה ולתשלום</button>
      <p class="mini" id="checkoutNote" style="margin-top:10px"></p>
    </div>
  </div>

  <!-- in-app Grow payment -->
  <div class="paywrap" id="payWrap" role="dialog" aria-modal="true" aria-label="תשלום">
    <div class="paytop">
      <button class="x" id="payClose" aria-label="ביטול תשלום">×</button>
      <b>תשלום מאובטח · הזמנה <span id="payOrderNo"></span></b>
      <b id="payAmount" style="color:var(--sale-d)"></b>
    </div>
    <iframe id="payFrame" title="דף תשלום Grow"></iframe>
    <div class="paywait">ממתין לאישור התשלום<span class="spin"></span> האישור יופיע כאן אוטומטית · <button id="payExternal" style="border:none;background:none;color:var(--brass-d);font-weight:800;text-decoration:underline;font-size:13px">לא נטען? פתיחה בחלון נפרד</button></div>
  </div>

  <!-- confirmation -->
  <div class="confirm" id="confirm">
    <div>
      <div class="ck">✓</div>
      <h2 id="confirmTitle">ההזמנה התקבלה!</h2>
      <div class="num" id="confirmNum">—</div>
      <p class="mini" id="confirmMsg"></p>
      <button class="ghostbtn" id="newOrderBtn" style="max-width:280px;margin:22px auto 0">הזמנה חדשה</button>
    </div>
  </div>

<script src="menu.js"></script>
</body>
</html>
